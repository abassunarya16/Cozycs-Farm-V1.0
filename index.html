<script>
var pages = {};
var currentPage = 'dashboard';
var lastBackPressTime = 0;

// KAMUS BAHASA GLOBAL (INDONESIA & ENGLISH)
var globalDict = {
    'id': {
        'owner_view': 'Owner View',
        'group_main': 'Utama',

        'nav_pruning': 'Pruning / Rempes',
        'nav_nutrition': 'Nutrisi & PPM',

        'nav_harvest_short': 'Panen',
        'nav_finance': 'Keuangan',
        'nav_settings': 'Pengaturan'
    },
    'en': {
        'owner_view': 'Owner View',
        'group_main': 'Main',
        'group_facilities': 'Facilities',
        'group_plants': 'Plants',
        'group_monitoring': 'Monitoring & Care',
        'group_business': 'Results & Business',
        'nav_dashboard': 'Dashboard',
        'nav_greenhouse': 'Greenhouse',
        'nav_warehouse': 'Warehouse Stock',
        'nav_plant_db': 'Plant Database',
        'nav_pollination': 'Flower Pollination',
        'nav_fruit_select': 'Fruit Selection',
        'nav_pruning': 'Pruning',
        'nav_nutrition': 'Nutrition & PPM',
        'nav_pests': 'Pests & Diseases',
        'nav_spray': 'Spray Schedule',
        'nav_notif': 'Notification Center',
        'nav_schedule': 'Daily Schedule',
        'nav_cctv': 'Live CCTV',
        'nav_harvest': 'Harvest Data',
        'nav_report': 'Farm Report',
        'nav_plants': 'Plants',
        'nav_nutrition_short': 'Nutrition',
        'nav_harvest_short': 'Harvest',
        'nav_finance': 'Finance',
        'nav_settings': 'Settings'
    }
};

/**
 * Menerapkan bahasa ke seluruh elemen navigasi dan memuat ulang halaman aktif
 */
window.applyAppLanguage = function(langCode) {
    var lang = langCode || localStorage.getItem('cozycs_lang') || 'id';
    var dict = globalDict[lang] || globalDict['id'];

    document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (dict[key]) {
            el.textContent = dict[key];
        }
    });

    // Refresh halaman aktif agar kontennya menyesuaikan bahasa
    if (typeof navigateTo === 'function') {
        navigateTo(currentPage, true);
    }
};

/**
 * Menerapkan Mode Gelap / Terang Global
 */
window.applyDarkModeGlobal = function() {
    var isDark = localStorage.getItem('cozycs_dark_mode') === 'true';
    if (isDark) {
        document.body.classList.add('dark-theme');
        document.documentElement.classList.add('dark-theme');
    } else {
        document.body.classList.remove('dark-theme');
        document.documentElement.classList.remove('dark-theme');
    }
};

/**
 * Fungsi Navigasi Utama Aplikasi
 */
function navigateTo(pageName, isBackNav) {
    var targetModule = pages[pageName];
    var mainContent = document.getElementById('mainContent');
    
    if (targetModule && mainContent) {
        currentPage = pageName;
        mainContent.innerHTML = targetModule.render();
        
        if (typeof targetModule.init === 'function') {
            targetModule.init();
        }
        
        // Update status tombol aktif di Bottom Nav
        var navItems = document.querySelectorAll('.bottom-nav .nav-item');
        navItems.forEach(function(item) {
            if (item.getAttribute('data-page') === pageName) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
        
        window.scrollTo(0, 0);

        // Rekam jejak ke History Browser jika bukan navigasi Back HP
        if (!isBackNav) {
            var newHash = '#' + pageName;
            if (window.location.hash !== newHash) {
                history.pushState({ page: pageName }, '', newHash);
            }
        }
    }
}

function toggleNotifikasiPage() {
    if (currentPage === 'notifikasi') {
        window.history.back();
    } else {
        navigateTo('notifikasi');
    }
}

// ----------------------------------------------------
// EVENT LISTENER TOMBOL BACK HP (ROOT ANCHOR TRAP)
// ----------------------------------------------------
window.addEventListener('popstate', function(event) {
    var state = event.state;

    // Jika pengguna kembali menyentuh titik paling dasar (Root Anchor) dari Dasbor
    if (state && state.page === 'root') {
        var now = Date.now();

        if (now - lastBackPressTime < 2000) {
            // Ketukan ke-2 dalam 2 detik: Biarkan keluar aplikasi
            return;
        } else {
            // Ketukan ke-1: Tahan, beri peringatan toast, dan dorong ulang Dasbor ke tumpukan atas
            lastBackPressTime = now;
            
            var msg = (localStorage.getItem('cozycs_lang') === 'en') ? 'Press back again to exit app' : 'Tekan sekali lagi untuk keluar aplikasi';
            if (typeof Helper !== 'undefined' && Helper.showToast) {
                Helper.showToast(msg, 'error');
            }
            
            // Kembalikan posisi history ke status dashboard
            history.pushState({ page: 'dashboard' }, '', '#dashboard');
            currentPage = 'dashboard';
            return;
        }
    }

    // Navigasi normal antar modul saat tombol Back ditekan
    var targetPage = (state && state.page) ? state.page : (window.location.hash.replace('#', '') || 'dashboard');
    if (pages[targetPage]) {
        navigateTo(targetPage, true);
    } else {
        navigateTo('dashboard', true);
    }
});

document.addEventListener('DOMContentLoaded', function() {
    // 1. Sinkronisasi Mode Gelap Global saat aplikasi dibuka
    window.applyDarkModeGlobal();

    if (typeof Storage !== 'undefined' && typeof Storage.init === 'function') {
        Storage.init();
    }

    // Set versi otomatis di Judul Sidebar
    var sidebarTitle = document.getElementById('sidebarTitle');
    if (sidebarTitle) {
        var appVer = (typeof Helper !== 'undefined' && Helper.VERSION) ? Helper.VERSION : (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '1.0');
        sidebarTitle.innerHTML = '<i class="fas fa-seedling"></i> Cozycs Farm v' + appVer;
    }
    
    pages = {
        'dashboard': dashboard,
        'greenhouse': greenhouse,
        'tanaman': tanaman,
        'polinasi': polinasi,
        'buah': buah,
        'nutrisi': nutrisi,
        'pruning': pruning,
        'hama': hama,
        'spray': spray,
        'notifikasi': notifikasi,
        'jadwal': jadwal,
        'panen': panen,
        'laporan': laporan,
        'gudang': gudang,
        'keuangan': keuangan,
        'setting': setting,
        'cctv': cctv
    };
    
    // INISIALISASI HISTORY STACK (Jangkar Root + Dashboard)
    if (!history.state || history.state.page !== 'root') {
        history.replaceState({ page: 'root' }, '', '#');
        history.pushState({ page: 'dashboard' }, '', '#dashboard');
    }
    
    navigateTo('dashboard', true);

    // 2. Terapkan Bahasa ke Seluruh Navigasi
    window.applyAppLanguage();
    
    var btnNotif = document.getElementById('btnHeaderNotif');
    if (btnNotif) {
        btnNotif.addEventListener('click', function() {
            toggleNotifikasiPage();
        });
    }
});

document.addEventListener('click', function(e) {
    var navBtn = e.target.closest('.bottom-nav .nav-item');
    if (navBtn) {
        var page = navBtn.getAttribute('data-page');
        if (page) navigateTo(page);
    }
});
</script>

<!-- ======================================== -->
<!-- SIDEBAR CONTROLLER -->
<!-- ======================================== -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    var sidebar = document.getElementById('appSidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var btnOpen = document.getElementById('btnOpenSidebar');
    var btnClose = document.getElementById('btnCloseSidebar');
    
    function openSidebar() {
        if (sidebar && overlay) {
            sidebar.classList.add('active');
            overlay.classList.add('active');
            document.body.classList.add('sidebar-open');
        }
    }
    
    function closeSidebar() {
        if (sidebar && overlay) {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.classList.remove('sidebar-open');
        }
    }
    
    if (btnOpen) btnOpen.addEventListener('click', openSidebar);
    if (btnClose) btnClose.addEventListener('click', closeSidebar);
    if (overlay) overlay.addEventListener('click', closeSidebar);
    
    document.querySelectorAll('.sidebar-item').forEach(function(item) {
        item.addEventListener('click', function() {
            var page = this.getAttribute('data-page');
            if (page) navigateTo(page);
            closeSidebar();
        });
    });
});
</script>

<!-- ======================================== -->
<!-- SERVICE WORKER & PWA AUTO UPDATE -->
<!-- ======================================== -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('✅ SW registered:', reg.scope);
            
            // Cek update SEGERA saat aplikasi dibuka
            reg.update();
            
            // Cek apakah sudah ada SW waiting
            if (reg.waiting) {
                console.log('🔄 SW waiting detected!');
                window.showUpdateToast(reg.waiting);
            }
            
            // Deteksi update baru
            reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (!newWorker) return;
                
                newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed') {
                        console.log('🔄 Update tersedia!');
                        window.showUpdateToast(newWorker);
                    }
                });
            });
            
            // Cek update berkala tiap 5 menit
            setInterval(function() {
                reg.update();
                console.log('🔍 Memeriksa pembaruan...');
            }, 300000);
            
        }).catch(function(err) {
            console.log('❌ SW registration failed:', err);
        });
        
        // Reload saat controller berubah
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
                refreshing = true;
                console.log('🔄 SW baru aktif, reload...');
                window.location.reload();
            }
        });
    });
    
    // ========================================
    // TOAST UPDATE
    // ========================================
    window.showUpdateToast = function(worker) {
        if (document.getElementById('pwaUpdateToast')) return;
        
        var isEn = (localStorage.getItem('cozycs_lang') === 'en');
        var toastText = isEn ? 'New version available!' : 'Versi baru Cozycs Farm tersedia!';
        var btnText = isEn ? 'UPDATE' : 'PERBARUI';

        var toastHtml = 
        '<div id="pwaUpdateToast" style="' +
            'position:fixed;bottom:75px;left:50%;transform:translateX(-50%);' +
            'background:#1B5E20;color:#fff;padding:10px 16px;' +
            'border-radius:30px;box-shadow:0 4px 15px rgba(0,0,0,0.3);' +
            'display:flex;align-items:center;gap:12px;z-index:999999;' +
            'font-family:sans-serif;font-size:12px;font-weight:600;' +
            'width:calc(100% - 40px);max-width:380px;' +
            'justify-content:space-between;border:1px solid #4CAF50;' +
            'animation:slideUpPwa 0.3s ease-out;' +
        '">' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
                '<i class="fas fa-sync-alt fa-spin" style="color:#A5D6A7;"></i>' +
                '<span>' + toastText + '</span>' +
            '</div>' +
            '<button id="btnReloadPwa" style="' +
                'background:#fff;color:#1B5E20;border:none;' +
                'padding:6px 14px;border-radius:20px;font-size:11px;' +
                'font-weight:800;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);' +
            '">' + btnText + '</button>' +
        '</div>' +
        '<style>' +
            '@keyframes slideUpPwa {' +
                'from {transform:translate(-50%,100%);opacity:0;}' +
                'to {transform:translate(-50%,0);opacity:1;}' +
            '}' +
        '</style>';
        
        document.body.insertAdjacentHTML('beforeend', toastHtml);
        
        document.getElementById('btnReloadPwa').addEventListener('click', function() {
            if (worker) {
                worker.postMessage({ action: 'skipWaiting' });
            } else if (navigator.serviceWorker.waiting) {
                navigator.serviceWorker.waiting.postMessage({ action: 'skipWaiting' });
            }
            
            setTimeout(function() {
                window.location.reload();
            }, 1500);
            
            var toast = document.getElementById('pwaUpdateToast');
            if (toast) toast.remove();
        });
    };
}
</script>
